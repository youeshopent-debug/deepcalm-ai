# Cloudflare Pages deployment configuration for DeepCalm AI
# Generated by the Vercel → Cloudflare Pages migration plan
name = "deepcalm-ai"

# The build output directory from Next.js static export
pages_build_output_dir = "out"

# ── Compatibility flags ────────────────────────────────────────────────
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# ── Build command ──────────────────────────────────────────────────────
# Step 1: Static export via Next.js
# Step 2: Generate static sitemap.xml
build_command = "npx next build && npx tsx scripts/generate-sitemap.ts"

# ── Environment variables ──────────────────────────────────────────────
# All env vars required by API functions.
# Set actual values via `npx wrangler pages secret put <KEY>`
# or Cloudflare Dashboard → Pages → deepcalm-ai → Settings → Environment Variables.

[vars]
DAILY_SEND_LIMIT = "30"

# ── Cron triggers (send-daily) ────────────────────────────────────────
# [[triggers]]
# crons = ["0 18 * * *"]   # 6:00 PM UTC = 2:00 AM SG time

# Note: Cron triggers for Pages Functions are configured via
# Cloudflare Dashboard → Workers & Pages → deepcalm-ai → Cron Triggers.
# The [[triggers]] section above is a binding placeholder.
# To activate, uncomment and deploy, then verify in dashboard.

# ── Route configuration ────────────────────────────────────────────────
# All routes are auto-detected from the functions/ directory and out/ static files.
# No manual route config needed for Pages.
